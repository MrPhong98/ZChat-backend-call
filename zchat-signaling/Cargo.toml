[package]
name = "zchat-signaling"
version = "0.1.0"
edition = "2021"
description = "Z-Chat WebRTC signaling server (Socket.IO) — Rust rewrite of server.py"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
socketioxide = { version = "0.14", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
